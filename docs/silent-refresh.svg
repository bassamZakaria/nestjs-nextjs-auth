<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 684" width="720" height="684" role="img" aria-label="Access token expired → silent refresh: The old refresh token (secret1) is now dead. Using it again is treated as theft.">
<style>
svg{--bg:#ffffff;--ink:#1b1c20;--dim:#666873;--line:#d8d6cd;--act:#2a5bd7;--err:#c4352b;--soft:#eef1fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#16181d;--ink:#ececf1;--dim:#9b9daa;--line:#343741;--act:#7ea4ff;--err:#ff7b6f;--soft:#20263a}}
g{--c:var(--act)}g.err{--c:var(--err)}g.self{--c:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}
.title{fill:var(--ink);font-weight:700;font-size:16px}.sub{fill:var(--dim);font-size:13px}
.lane{fill:var(--soft);stroke:var(--line)}.lane-t{fill:var(--ink);font-weight:600;font-size:13px}
.life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 5}.rule{stroke:var(--line)}
.badge{fill:var(--bg);stroke:var(--line)}.badge-n{fill:var(--dim);font-weight:600;font-size:11px}
.mono{fill:var(--c);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.lbl{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.arrow{stroke:var(--c);stroke-width:2;fill:none}.arrow.req{stroke-dasharray:1}.arrow.res{stroke-dasharray:6 5}
.tip,.dot{fill:var(--c)}.dot{opacity:0}.box{fill:var(--bg);stroke:var(--c);stroke-width:1.5}
.cap-h{fill:var(--ink);font-weight:700;font-size:13px}.cap-h.err{fill:var(--err)}.cap-t{fill:var(--dim);font-size:13px}
.s0{animation:s0 40.6s linear infinite}@keyframes s0{0%,1.48%{opacity:0}2.22%,98.52%{opacity:1}100%{opacity:0}}.d0{animation:d0 40.6s linear infinite}@keyframes d0{0%,1.48%{stroke-dashoffset:1}3.20%,100%{stroke-dashoffset:0}}.h0{animation:h0 40.6s linear infinite}@keyframes h0{0%,2.96%{opacity:0}3.20%,100%{opacity:1}}.t0{animation:t0 40.6s linear infinite}@keyframes t0{0%,1.48%{opacity:0;transform:translateX(0)}1.53%{opacity:1;transform:translateX(0)}3.20%{opacity:1;transform:translateX(250px)}3.45%,100%{opacity:0;transform:translateX(250px)}}.c0{animation:c0 40.6s linear infinite}@keyframes c0{0%,1.48%{opacity:0}2.09%,9.73%{opacity:1}9.85%,100%{opacity:0}}.s1{animation:s1 40.6s linear infinite}@keyframes s1{0%,9.85%{opacity:0}10.59%,98.52%{opacity:1}100%{opacity:0}}.c1{animation:c1 40.6s linear infinite}@keyframes c1{0%,9.85%{opacity:0}10.47%,18.10%{opacity:1}18.23%,100%{opacity:0}}.s2{animation:s2 40.6s linear infinite}@keyframes s2{0%,18.23%{opacity:0}18.97%,98.52%{opacity:1}100%{opacity:0}}.t2{animation:t2 40.6s linear infinite}@keyframes t2{0%,18.23%{opacity:0;transform:translateX(0)}18.28%{opacity:1;transform:translateX(0)}19.95%{opacity:1;transform:translateX(-250px)}20.20%,100%{opacity:0;transform:translateX(-250px)}}.c2{animation:c2 40.6s linear infinite}@keyframes c2{0%,18.23%{opacity:0}18.84%,26.48%{opacity:1}26.60%,100%{opacity:0}}.s3{animation:s3 40.6s linear infinite}@keyframes s3{0%,26.60%{opacity:0}27.34%,98.52%{opacity:1}100%{opacity:0}}.c3{animation:c3 40.6s linear infinite}@keyframes c3{0%,26.60%{opacity:0}27.22%,34.85%{opacity:1}34.98%,100%{opacity:0}}.s4{animation:s4 40.6s linear infinite}@keyframes s4{0%,34.98%{opacity:0}35.71%,98.52%{opacity:1}100%{opacity:0}}.d4{animation:d4 40.6s linear infinite}@keyframes d4{0%,34.98%{stroke-dashoffset:1}36.70%,100%{stroke-dashoffset:0}}.h4{animation:h4 40.6s linear infinite}@keyframes h4{0%,36.45%{opacity:0}36.70%,100%{opacity:1}}.t4{animation:t4 40.6s linear infinite}@keyframes t4{0%,34.98%{opacity:0;transform:translateX(0)}35.02%{opacity:1;transform:translateX(0)}36.70%{opacity:1;transform:translateX(250px)}36.95%,100%{opacity:0;transform:translateX(250px)}}.c4{animation:c4 40.6s linear infinite}@keyframes c4{0%,34.98%{opacity:0}35.59%,43.23%{opacity:1}43.35%,100%{opacity:0}}.s5{animation:s5 40.6s linear infinite}@keyframes s5{0%,43.35%{opacity:0}44.09%,98.52%{opacity:1}100%{opacity:0}}.d5{animation:d5 40.6s linear infinite}@keyframes d5{0%,43.35%{stroke-dashoffset:1}45.07%,100%{stroke-dashoffset:0}}.h5{animation:h5 40.6s linear infinite}@keyframes h5{0%,44.83%{opacity:0}45.07%,100%{opacity:1}}.t5{animation:t5 40.6s linear infinite}@keyframes t5{0%,43.35%{opacity:0;transform:translateX(0)}43.40%{opacity:1;transform:translateX(0)}45.07%{opacity:1;transform:translateX(250px)}45.32%,100%{opacity:0;transform:translateX(250px)}}.c5{animation:c5 40.6s linear infinite}@keyframes c5{0%,43.35%{opacity:0}43.97%,51.60%{opacity:1}51.72%,100%{opacity:0}}.s6{animation:s6 40.6s linear infinite}@keyframes s6{0%,51.72%{opacity:0}52.46%,98.52%{opacity:1}100%{opacity:0}}.c6{animation:c6 40.6s linear infinite}@keyframes c6{0%,51.72%{opacity:0}52.34%,59.98%{opacity:1}60.10%,100%{opacity:0}}.s7{animation:s7 40.6s linear infinite}@keyframes s7{0%,60.10%{opacity:0}60.84%,98.52%{opacity:1}100%{opacity:0}}.t7{animation:t7 40.6s linear infinite}@keyframes t7{0%,60.10%{opacity:0;transform:translateX(0)}60.15%{opacity:1;transform:translateX(0)}61.82%{opacity:1;transform:translateX(-250px)}62.07%,100%{opacity:0;transform:translateX(-250px)}}.c7{animation:c7 40.6s linear infinite}@keyframes c7{0%,60.10%{opacity:0}60.71%,68.35%{opacity:1}68.47%,100%{opacity:0}}.s8{animation:s8 40.6s linear infinite}@keyframes s8{0%,68.47%{opacity:0}69.21%,98.52%{opacity:1}100%{opacity:0}}.d8{animation:d8 40.6s linear infinite}@keyframes d8{0%,68.47%{stroke-dashoffset:1}70.20%,100%{stroke-dashoffset:0}}.h8{animation:h8 40.6s linear infinite}@keyframes h8{0%,69.95%{opacity:0}70.20%,100%{opacity:1}}.t8{animation:t8 40.6s linear infinite}@keyframes t8{0%,68.47%{opacity:0;transform:translateX(0)}68.52%{opacity:1;transform:translateX(0)}70.20%{opacity:1;transform:translateX(250px)}70.44%,100%{opacity:0;transform:translateX(250px)}}.c8{animation:c8 40.6s linear infinite}@keyframes c8{0%,68.47%{opacity:0}69.09%,76.72%{opacity:1}76.85%,100%{opacity:0}}.s9{animation:s9 40.6s linear infinite}@keyframes s9{0%,76.85%{opacity:0}77.59%,98.52%{opacity:1}100%{opacity:0}}.t9{animation:t9 40.6s linear infinite}@keyframes t9{0%,76.85%{opacity:0;transform:translateX(0)}76.90%{opacity:1;transform:translateX(0)}78.57%{opacity:1;transform:translateX(-250px)}78.82%,100%{opacity:0;transform:translateX(-250px)}}.c9{animation:c9 40.6s linear infinite}@keyframes c9{0%,76.85%{opacity:0}77.46%,85.10%{opacity:1}85.22%,100%{opacity:0}}.c10{animation:c10 40.6s linear infinite}@keyframes c10{0%,85.22%{opacity:0}85.84%,98.40%{opacity:1}98.52%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cap{opacity:0}.cap.final{opacity:1}*{animation:none!important}}

</style>
<rect class="bg" x="0.5" y="0.5" width="719" height="683" rx="10"/><text class="title" x="16" y="27">Access token expired → silent refresh</text><text class="sub" x="16" y="46">After 15 minutes the browser gets a new access token without the user noticing.</text><line class="life" x1="110" y1="100" x2="110" y2="574"/><rect class="lane" x="50" y="62" width="120" height="34" rx="8"/><text class="lane-t" x="110" y="84" text-anchor="middle">Browser</text><line class="life" x1="360" y1="100" x2="360" y2="574"/><rect class="lane" x="300" y="62" width="120" height="34" rx="8"/><text class="lane-t" x="360" y="84" text-anchor="middle">API (NestJS)</text><line class="life" x1="610" y1="100" x2="610" y2="574"/><rect class="lane" x="550" y="62" width="120" height="34" rx="8"/><text class="lane-t" x="610" y="84" text-anchor="middle">MongoDB</text><line class="rule" x1="16" y1="588" x2="704" y2="588"/><g class="s0"><circle class="badge" cx="20" cy="140" r="10"/><text class="badge-n" x="20" y="144" text-anchor="middle">1</text><line class="arrow req d0" pathLength="1" x1="110" y1="140" x2="351" y2="140"/><polygon class="tip h0" points="360,140 349,135 349,145"/><text class="mono lbl" x="235" y="131" text-anchor="middle">GET /api/users/me</text><circle class="dot t0" cx="110" cy="140" r="5"/></g><g class="cap c0"><text class="cap-h" x="16" y="612">1. GET /api/users/me</text><text class="cap-t" x="16" y="632">The access cookie reached its Max-Age, so the browser no longer sends it. Only the refresh cookie</text><text class="cap-t" x="16" y="650">goes along.</text></g><g class="s1 err"><circle class="badge" cx="20" cy="186" r="10"/><text class="badge-n" x="20" y="190" text-anchor="middle">2</text><rect class="box" x="251.10000000000002" y="171" width="217.79999999999998" height="30" rx="7"/><text class="mono" x="360" y="190" text-anchor="middle">AuthGuard: no access token</text></g><g class="cap c1"><text class="cap-h err" x="16" y="612">2. AuthGuard: no access token</text><text class="cap-t" x="16" y="632">A missing token and an expired token are treated the same way.</text></g><g class="s2 err"><circle class="badge" cx="20" cy="232" r="10"/><text class="badge-n" x="20" y="236" text-anchor="middle">3</text><line class="arrow res" x1="360" y1="232" x2="119" y2="232"/><polygon class="tip" points="110,232 121,227 121,237"/><text class="mono lbl" x="235" y="223" text-anchor="middle">401 Unauthorized</text><circle class="dot t2" cx="360" cy="232" r="5"/></g><g class="cap c2"><text class="cap-h err" x="16" y="612">3. 401 Unauthorized</text><text class="cap-t" x="16" y="632">The frontend client sees a 401 on a normal route and decides to refresh.</text></g><g class="s3 self"><circle class="badge" cx="20" cy="278" r="10"/><text class="badge-n" x="20" y="282" text-anchor="middle">4</text><rect class="box" x="38" y="263" width="232.4" height="30" rx="7"/><text class="mono" x="154.2" y="282" text-anchor="middle">take lock, start one refresh</text></g><g class="cap c3"><text class="cap-h" x="16" y="612">4. take lock, start one refresh</text><text class="cap-t" x="16" y="632">One refresh per tab (refreshInFlight), and one at a time across tabs (Web Lock auth-refresh).</text></g><g class="s4"><circle class="badge" cx="20" cy="324" r="10"/><text class="badge-n" x="20" y="328" text-anchor="middle">5</text><line class="arrow req d4" pathLength="1" x1="110" y1="324" x2="351" y2="324"/><polygon class="tip h4" points="360,324 349,319 349,329"/><text class="mono lbl" x="235" y="315" text-anchor="middle">POST /api/auth/refresh</text><circle class="dot t4" cx="110" cy="324" r="5"/></g><g class="cap c4"><text class="cap-h" x="16" y="612">5. POST /api/auth/refresh</text><text class="cap-t" x="16" y="632">The refresh cookie S1.family.secret1 is attached.</text></g><g class="s5"><circle class="badge" cx="20" cy="370" r="10"/><text class="badge-n" x="20" y="374" text-anchor="middle">6</text><line class="arrow req d5" pathLength="1" x1="360" y1="370" x2="601" y2="370"/><polygon class="tip h5" points="610,370 599,365 599,375"/><text class="mono lbl" x="485" y="361" text-anchor="middle">swap secret1 → secret2 (atomic)</text><circle class="dot t5" cx="360" cy="370" r="5"/></g><g class="cap c5"><text class="cap-h" x="16" y="612">6. swap secret1 → secret2 (atomic)</text><text class="cap-t" x="16" y="632">One findOneAndUpdate that matches session id, family hash, secret hash and “not expired”, and</text><text class="cap-t" x="16" y="650">writes the new secret hash. Being a single operation, two requests cannot both win.</text></g><g class="s6 self"><circle class="badge" cx="20" cy="416" r="10"/><text class="badge-n" x="20" y="420" text-anchor="middle">7</text><rect class="box" x="285" y="401" width="150" height="30" rx="7"/><text class="mono" x="360" y="420" text-anchor="middle">sign new JWT</text></g><g class="cap c6"><text class="cap-h" x="16" y="612">7. sign new JWT</text><text class="cap-t" x="16" y="632">The user is reloaded first, so a deleted account cannot be refreshed.</text></g><g class="s7"><circle class="badge" cx="20" cy="462" r="10"/><text class="badge-n" x="20" y="466" text-anchor="middle">8</text><line class="arrow res" x1="360" y1="462" x2="119" y2="462"/><polygon class="tip" points="110,462 121,457 121,467"/><text class="mono lbl" x="235" y="453" text-anchor="middle">200 + Set-Cookie × 2</text><circle class="dot t7" cx="360" cy="462" r="5"/></g><g class="cap c7"><text class="cap-h" x="16" y="612">8. 200 + Set-Cookie × 2</text><text class="cap-t" x="16" y="632">A new access token and a new refresh token. The session id and family stay the same; only the</text><text class="cap-t" x="16" y="650">secret changed. The session's 7-day expiry is not extended.</text></g><g class="s8"><circle class="badge" cx="20" cy="508" r="10"/><text class="badge-n" x="20" y="512" text-anchor="middle">9</text><line class="arrow req d8" pathLength="1" x1="110" y1="508" x2="351" y2="508"/><polygon class="tip h8" points="360,508 349,503 349,513"/><text class="mono lbl" x="235" y="499" text-anchor="middle">GET /api/users/me (retry)</text><circle class="dot t8" cx="110" cy="508" r="5"/></g><g class="cap c8"><text class="cap-h" x="16" y="612">9. GET /api/users/me (retry)</text><text class="cap-t" x="16" y="632">The original request is sent again, once.</text></g><g class="s9"><circle class="badge" cx="20" cy="554" r="10"/><text class="badge-n" x="20" y="558" text-anchor="middle">10</text><line class="arrow res" x1="360" y1="554" x2="119" y2="554"/><polygon class="tip" points="110,554 121,549 121,559"/><text class="mono lbl" x="235" y="545" text-anchor="middle">200 { id, email, name }</text><circle class="dot t9" cx="360" cy="554" r="5"/></g><g class="cap c9"><text class="cap-h" x="16" y="612">10. 200 { id, email, name }</text><text class="cap-t" x="16" y="632">The page carries on as if nothing happened.</text></g><g class="cap c10 final"><text class="cap-h" x="16" y="612">Result</text><text class="cap-t" x="16" y="632">The old refresh token (secret1) is now dead. Using it again is treated as theft.</text></g>
</svg>
